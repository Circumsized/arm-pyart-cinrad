name: build-deploy-site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

# The docs build executes every ``examples/**/plot_*.py`` via Sphinx-Gallery.
# Run it in offline mode (PYART_DOCS_OFFLINE=1) so the many remote-data
# downloads cannot stretch the job past its timeout, and cache the two data
# caches so warm builds are fast. Publishing only happens on main pushes.
jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}
    env:
      PYART_DOCS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: doc/environment.yml
          micromamba-version: '2.0.0-0'
          environment-name: pyart-docs
          cache-downloads: false

      - name: Fetch all history for all tags and branches
        run: |
          git fetch --prune --unshallow

      - name: Cache example datasets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pyart-datasets
            ~/.cache/open-radar-data
          key: pyart-example-data-${{ hashFiles('doc/environment.yml', 'pyart/testing/registry.txt') }}
          restore-keys: |
            pyart-example-data-

      - name: Install PyART
        run: |
          pip install -e . --no-deps --force-reinstall

      - name: Build the site
        run: |
          cd doc
          make html

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: doc/build/html
          retention-days: 7

  deploy-docs:
    needs: build-docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: html-docs
          path: doc/build/html

      - name: GitHub Pages action
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/build/html
          publish_branch: gh-pages
