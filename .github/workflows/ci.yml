name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy Cython
      - name: Install package
        run: pip install .
      - name: Install test dependencies
        run: pip install pytest pytest-mpl
      - name: Syntax check
        run: python -m compileall pyart -q
      - name: Run offline tests
        run: |
          python -m pytest pyart/io/tests/test_c98d_archive.py pyart/io/tests/test_sband_archive.py pyart/io/tests/test_xband_bridge.py pyart/io/tests/test_xband_native.py pyart/io/tests/test_cinrad_routing.py pyart/io/tests/test_cinrad_bridge.py pyart/graph/tests/test_animation.py pyart/correct/tests/test_dualpol_pipeline.py -v
